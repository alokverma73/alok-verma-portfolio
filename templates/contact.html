{% extends "base.html" %}

{% block title %}Contact — Alok Verma{% endblock %}

{% block content %}

<section class="page-hero">

    <div class="page-number">05</div>

    <div>
        <p class="eyebrow">GET IN TOUCH</p>

        <h1>
            Let's build<br>
            <span>something.</span>
        </h1>
    </div>

</section>


<section class="contact-section">

    <div class="section-label">
                Contact
    </div>

    <div class="contact-grid">

        <div class="contact-intro">

            <p class="large-text">
                Have an opportunity, idea, or project in mind?
                Let's talk.
            </p>

            <div class="contact-details">

                <a href="mailto:alokv7373@gmail.com">
                    alokv7373@gmail.com
                    <span>↗</span>
                </a>

                <a
                    href="https://www.linkedin.com/in/alok-verma-b4452432b"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                    <span>↗</span>
                </a>

                <a
                    href="https://github.com/alokverma73"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                    <span>↗</span>
                </a>

            </div>

        </div>


        <form
            class="contact-form"
            id="contactForm"
        >

            <div class="form-group">

                <label for="name">NAME</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What's this about?"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Tell me a little about it..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Send message
            </button>

            <p
                id="formStatus"
                class="form-status"
                aria-live="polite"
            ></p>

        </form>

    </div>

</section>

{% endblock %}
